
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: examschedule-postgres
    environment:
      POSTGRES_USER: anand
      POSTGRES_PASSWORD: "1107"
      POSTGRES_DB: dockertaskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - examschedule-network
    restart: unless-stopped

  examschedule-backend:
    image: examschedule-backend:latest
    build:
      context: ./ExamSchedule
      dockerfile: backend.Dockerfile
    container_name: examschedule-springboot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/dockertaskdb
      SPRING_DATASOURCE_USERNAME: anand
      SPRING_DATASOURCE_PASSWORD: "1107"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - examschedule-network

volumes:
  postgres_data:

networks:
  examschedule-network:
    driver: bridge

